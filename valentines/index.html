<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our 7 Months</title>
    <link rel="stylesheet" href="style-v2.css">
</head>
<body>
    <div class="background-clouds">
        <div class="cloud heart-cloud-1"></div>
        <div class="cloud heart-cloud-2"></div>
        <div class="cloud plain-cloud-1"></div>
        <div class="cloud plain-cloud-2"></div>
        <div class="cloud plain-cloud-3"></div>
    </div>
    <main class="content-wrapper">
        <h1>Our Cloud of Memories</h1>
        <p id="intro-message">Hi my love, every moment with you is a precious memory. Here's a little collection of our adventures together, waiting to be rediscovered. Click to reveal!</p>
        <div id="gallery-container"></div>
    </main>

    <!-- The Modal/Lightbox -->
    <div id="modal" class="modal">
        <span class="close-button">&times;</span>
        <div class="modal-content">
            <img id="modal-image" src="" alt="Memory">
            <p id="modal-message"></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
